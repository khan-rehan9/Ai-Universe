
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b14">
<meta name="description" content="AI Universe — your all-in-one AI workspace">
<title>AI Universe</title>

<style>
:root {
  color-scheme: dark;
  --bg:#090b14;
  --panel:#111522;
  --panel2:#171c2c;
  --border:#292f45;
  --text:#f4f5ff;
  --muted:#9ba4bd;
  --accent:#9b7bff;
  --accent2:#6848e8;
  --danger:#ff8585;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:Inter,system-ui,-apple-system,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{
outline:2px solid var(--accent);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
.hidden,[hidden]{display:none!important}
button,.panel,input,textarea,select{border-radius:12px}
button{color:var(--text)}
#loginScreen{min-height:100dvh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:420px;padding:30px;background:var(--panel);
border:1px solid var(--border);border-radius:24px}
.logo{font-weight:850;font-size:24px;letter-spacing:-.8px}
.logo span{color:#b5a1ff}
.login-card p,.muted{color:var(--muted);line-height:1.6}
.primary{background:linear-gradient(120deg,var(--accent2),var(--accent));
border:0;padding:12px 16px;font-weight:650}
.secondary{background:var(--panel2);border:1px solid var(--border);padding:10px 13px}
.full{width:100%;margin-top:12px}
#app{min-height:100dvh;display:flex}
.sidebar{width:260px;flex-shrink:0;background:var(--panel);
border-right:1px solid var(--border);padding:16px;display:flex;
flex-direction:column;gap:9px}
.sidebar-top{display:flex;align-items:center;justify-content:space-between;
padding:5px 2px 16px}
.nav,.new-chat{width:100%;text-align:left;padding:11px 12px;
background:transparent;border:1px solid transparent}
.nav:hover,.nav.active{background:var(--panel2);border-color:var(--border)}
.new-chat{background:var(--accent2);font-weight:650}
.section-label{font-size:12px;color:var(--muted);margin:17px 4px 4px}
.history{overflow-y:auto;max-height:35dvh}
.history-row{display:flex;gap:3px;align-items:center}
.history-open{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
white-space:nowrap;text-align:left;background:transparent;border:0;padding:10px 5px}
.delete-chat{background:transparent;border:0;color:var(--muted);padding:8px}
.account-area{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh}
.topbar{height:64px;flex-shrink:0;display:flex;align-items:center;gap:12px;
padding:0 20px;border-bottom:1px solid var(--border)}
.topbar h1{font-size:16px;font-weight:650;flex:1}
.menu{display:none}
.account{font-size:12px;color:var(--muted);max-width:160px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.messages{flex:1;overflow-y:auto;width:100%;padding:24px 18px}
.message-list{max-width:850px;margin:auto}
.welcome{min-height:45vh;display:flex;flex-direction:column;
justify-content:center;align-items:center;text-align:center;padding:20px}
.welcome h2{font-size:clamp(27px,5vw,42px);margin:12px 0}
.welcome p{max-width:480px;color:var(--muted);line-height:1.7}
.quick-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.message{margin:14px 0;padding:15px 16px;border:1px solid var(--border);
border-radius:17px;line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap}
.message.user{background:#1a2035;margin-left:clamp(0px,8%,65px)}
.message.assistant{background:var(--panel);margin-right:clamp(0px,8%,65px)}
.message-role{font-size:11px;color:var(--muted);margin-bottom:5px}
.composer-wrap{flex-shrink:0;padding:12px 16px max(12px,env(safe-area-inset-bottom));
background:linear-gradient(transparent,var(--bg) 12%)}
.composer-box{max-width:850px;margin:auto;background:var(--panel);
border:1px solid var(--border);border-radius:20px;padding:10px}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;max-height:180px;min-height:48px;
resize:vertical;background:transparent;border:0;color:var(--text);
padding:12px;outline:none}
.send{width:46px;height:46px;border:0;background:var(--accent2);
border-radius:14px;font-size:20px}
.composer-note{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}
.status{max-width:850px;margin:8px auto 0;font-size:12px;
color:var(--muted);overflow-wrap:anywhere}
.tool-card{max-width:850px;margin:0 auto 16px;padding:20px;
background:var(--panel);border:1px solid var(--border);border-radius:18px}
.tool-card h2{margin-top:0}
.tool-card input,.tool-card textarea,.tool-card select{
display:block;width:100%;padding:12px;margin:8px 0 15px;
background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tool-card textarea{min-height:100px}
.tool-actions{display:flex;flex-wrap:wrap;gap:8px}
.tool-actions button{flex:1}
.result{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
@media(max-width:760px){
.sidebar{display:none;position:fixed;inset:0 auto 0 0;z-index:10;
width:min(290px,86vw);height:100dvh;overflow-y:auto;box-shadow:15px 0 40px #0009}
.sidebar.open{display:flex}
.menu{display:inline-block;background:var(--panel2);border:1px solid var(--border);
padding:8px 11px}
.topbar{padding:0 12px}
.messages{padding:15px 10px}
.composer-wrap{padding-left:8px;padding-right:8px}
.account{max-width:100px}
}
</style>
</head>

<body>
<section id="loginScreen">
  <div class="login-card">
    <div class="logo">✦ AI <span>Universe</span></div>
    <h1>Your AI workspace</h1>
    <p>Chat, create, research, write and organize your ideas in one place.</p>
    <button class="primary full" id="googleLogin">Continue with Google</button>
    <p id="loginStatus" role="status" aria-live="polite"></p>
    <p class="muted" style="font-size:12px">Your Google account is used for sign-in. AI features require a working backend.</p>
  </div>
</section>

<div id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="logo">✦ AI <span>Universe</span></div>
      <button class="secondary" id="closeMenu" aria-label="Close menu">×</button>
    </div>
    <button class="new-chat" id="newChat">＋ New chat</button>
    <button class="nav active" data-view="chat">◈ AI Chat</button>
    <button class="nav" data-view="youtube">▶ YouTube planner</button>
    <button class="nav" data-view="files">▤ File assistant</button>
    <button class="nav" data-view="utilities">⌘ Text utilities</button>
    <button class="nav" id="exportChats">↓ Export chat backup</button>
    <div class="section-label">YOUR CONVERSATIONS</div>
    <div class="history" id="history"></div>
    <div class="account-area">
      <div class="section-label" id="accountLabel">Account</div>
      <button class="nav" id="logout">↪ Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu" id="menu" aria-label="Open menu">☰</button>
      <h1 id="viewTitle">AI Universe</h1>
      <span class="account" id="userEmail"></span>
    </header>

    <section class="messages" id="messages" aria-live="polite">
      <div class="message-list" id="messageList"></div>
    </section>

    <div class="composer-wrap" id="composerWrap">
      <div class="composer-box">
        <form class="composer" id="chatForm">
          <textarea id="prompt" rows="1" placeholder="Ask anything..." aria-label="Message AI Universe" required></textarea>
          <button class="send" id="send" aria-label="Send message" type="submit">↑</button>
        </form>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="composer-note">AI can make mistakes. Verify important information.</div>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithRedirect,
  getRedirectResult, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDocs, setDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBz2h4pdzHIWcEMMJbd1EVr7zUVviWJ8q4",
  authDomain: "ai-universe-7d50b.firebaseapp.com",
  projectId: "ai-universe-7d50b",
  storageBucket: "ai-universe-7d50b.firebasestorage.app",
  messagingSenderId: "904718036677",
  appId: "1:904718036677:web:316d06e91a264de02b4aac",
  measurementId: "G-7CFGGW2R81"
};

const $ = id => document.getElementById(id);
const loginScreen = $("loginScreen");
const appShell = $("app");
const sidebar = $("sidebar");
const messageList = $("messageList");
const promptInput = $("prompt");

let auth, db, user = null;
let chats = [];
let activeId = null;
let busy = false;
let view = "chat";

const makeId = () => crypto.randomUUID
  ? crypto.randomUUID()
  : Date.now().toString(36) + Math.random().toString(36).slice(2);

const activeChat = () => chats.find(c => c.id === activeId);
const setStatus = text => $("status").textContent = text || "";
const setLoginStatus = text => $("loginStatus").textContent = text || "";

function cleanChat(data) {
  if (!data || typeof data.id !== "string") return null;
  const messages = Array.isArray(data.messages) ? data.messages : [];
  return {
    id: data.id,
    title: typeof data.title === "string" ? data.title : "New chat",
    messages: messages.filter(m =>
      m && ["user", "assistant"].includes(m.role) &&
      typeof m.text === "string"
    ).slice(-200)
  };
}

function renderHistory() {
  const box = $("history");
  box.replaceChildren();

  [...chats].reverse().forEach(chat => {
    const row = document.createElement("div");
    row.className = "history-row";

    const open = document.createElement("button");
    open.className = "history-open";
    open.textContent = chat.title || "New chat";
    open.onclick = () => openChat(chat.id);

    const del = document.createElement("button");
    del.className = "delete-chat";
    del.textContent = "×";
    del.setAttribute("aria-label", "Delete " + chat.title);
    del.onclick = () => removeChat(chat.id);

    row.append(open, del);
    box.append(row);
  });
}

function renderChat() {
  messageList.replaceChildren();
  const chat = activeChat();

  if (!chat || !chat.messages.length) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";

    const logo = document.createElement("div");
    logo.className = "logo";
    logo.textContent = "✦ AI Universe";

    const heading = document.createElement("h2");
    heading.textContent = "What can I help with?";

    const description = document.createElement("p");
    description.textContent =
      "Ask a question, explore an idea, write code or plan your next project.";

    const quick = document.createElement("div");
    quick.className = "quick-actions";

    [
      ["Explain something", "Explain a complex topic in simple language."],
      ["Write code", "Help me write and debug code."],
      ["Create a video plan", "Help me plan an engaging YouTube video."]
    ].forEach(([label, text]) => {
      const button = document.createElement("button");
      button.className = "secondary";
      button.textContent = label;
      button.onclick = () => {
        promptInput.value = text;
        promptInput.focus();
      };
      quick.append(button);
    });

    welcome.append(logo, heading, description, quick);
    messageList.append(welcome);
  } else {
    chat.messages.forEach(message => {
      const el = document.createElement("article");
      el.className = "message " + message.role;

      const role = document.createElement("div");
      role.className = "message-role";
      role.textContent = message.role === "user" ? "YOU" : "AI UNIVERSE";

      const content = document.createElement("div");
      content.className = "result";
      content.textContent = message.text;

      el.append(role, content);
      messageList.append(el);
    });
  }

  renderHistory();
  $("messages").scrollTop = $("messages").scrollHeight;
}

async function saveChat(chat) {
  if (!user || !db) return false;

  try {
    await setDoc(doc(db, "users", user.uid, "chats", chat.id), {
      title: chat.title,
      messages: chat.messages.slice(-200),
      updatedAt: Date.now()
    });
    return true;
  } catch (error) {
    console.error("Save chat failed", error);
    setStatus("Cloud save failed. Check Firestore rules and your connection.");
    return false;
  }
}

async function loadChats() {
  setStatus("Loading your chats...");
  try {
    const snapshot = await getDocs(
      collection(db, "users", user.uid, "chats")
    );

    chats = snapshot.docs
      .map(d => cleanChat({ id: d.id, ...d.data() }))
      .filter(Boolean);

    chats.sort((a, b) => a.id.localeCompare(b.id));
    activeId = chats.length ? chats[chats.length - 1].id : null;

    if (!activeId) await createChat();
    else renderChat();

    setStatus("");
  } catch (error) {
    console.error("Load chats failed", error);
    chats = [];
    activeId = null;
    renderChat();
    setStatus("Could not load cloud history. Check Firestore database and security rules.");
  }
}

async function createChat() {
  if (!user) return;

  const chat = { id: makeId(), title: "New chat", messages: [] };
  chats.push(chat);
  activeId = chat.id;
  view = "chat";
  showView("chat");
  renderChat();
  await saveChat(chat);
}

async function openChat(id) {
  if (busy) return;
  if (!chats.some(c => c.id === id)) return;

  activeId = id;
  showView("chat");
  sidebar.classList.remove("open");
  renderChat();
}

async function removeChat(id) {
  if (busy || !user) return;

  const chat = chats.find(c => c.id === id);
  if (!chat || !confirm("Permanently delete this conversation?")) return;

  try {
    await deleteDoc(doc(db, "users", user.uid, "chats", id));
    chats = chats.filter(c => c.id !== id);

    if (activeId === id) activeId = null;
    if (!activeId) await createChat();
    else renderChat();

    setStatus("Conversation deleted.");
  } catch (error) {
    console.error(error);
    setStatus("Delete failed. Check Firestore rules and connection.");
  }
}

async function sendMessage(text) {
  const chat = activeChat();
  if (!user || !chat || busy || !text.trim()) return;

  busy = true;
  $("send").disabled = true;
  setStatus("AI is thinking...");

  chat.messages.push({ role: "user", text: text.trim() });
  if (chat.title === "New chat") {
    chat.title = text.trim().slice(0, 45);
  }

  renderChat();
  await saveChat(chat);

  try {
    const token = await user.getIdToken();

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({
        messages: chat.messages.slice(-40).map(m => ({
          role: m.role,
          text: m.text
        }))
      })
    });

    const data = await response.json().catch(() => null);

    if (!response.ok) {
      throw new Error(
        data && typeof data.error === "string"
          ? data.error
          : "AI request failed (" + response.status + ")."
      );
    }

    if (!data || typeof data.reply !== "string" || !data.reply.trim()) {
      throw new Error("The AI returned an empty response.");
    }

    chat.messages.push({ role: "assistant", text: data.reply.trim() });
    renderChat();
    await saveChat(chat);
    setStatus("");
  } catch (error) {
    console.error("Chat request failed", error);
    setStatus(error.message || "Request failed. Please try again.");
  } finally {
    busy = false;
    $("send").disabled = false;
  }
}

function showView(nextView) {
  view = nextView;
  const titles = {
    chat: "AI Universe",
    youtube: "YouTube Planner",
    files: "File Assistant",
    utilities: "Text Utilities"
  };

  $("viewTitle").textContent = titles[nextView] || "AI Universe";
  $("composerWrap").hidden = nextView !== "chat";
  sidebar.classList.remove("open");

  document.querySelectorAll("[data-view]").forEach(button => {
    button.classList.toggle("active", button.dataset.view === nextView);
  });

  setStatus("");
  messageList.replaceChildren();

  if (nextView === "chat") {
    renderChat();
  } else if (nextView === "youtube") {
    renderYouTube();
  } else if (nextView === "files") {
    renderFiles();
  } else if (nextView === "utilities") {
    renderUtilities();
  }
}

function renderYouTube() {
  const card = document.createElement("div");
  card.className = "tool-card";
  card.innerHTML = `
    <h2>▶ YouTube AI Planner</h2>
    <p class="muted">Create a script and detailed production plan in your main chat.</p>
    <label for="ytTopic">Video topic</label>
    <input id="ytTopic" placeholder="Enter your video topic">
    <label for="ytLanguage">Language</label>
    <select id="ytLanguage">
      <option>Hindi</option><option>English</option><option>Hinglish</option>
    </select>
    <label for="ytDuration">Target duration</label>
    <select id="ytDuration">
      <option>60 seconds</option><option>5 minutes</option>
      <option>10 minutes</option><option>15 minutes</option>
      <option>30 minutes or longer</option>
    </select>
    <div class="tool-actions">
      <button class="primary" id="ytGenerate">Create video plan</button>
    </div>
    <p class="muted">This creates a text plan, not a rendered video.</p>
  `;
  messageList.append(card);

  $("ytGenerate").onclick = async () => {
    const topic = $("ytTopic").value.trim();
    if (!topic) {
      $("ytTopic").focus();
      return;
    }

    const language = $("ytLanguage").value;
    const duration = $("ytDuration").value;

    showView("chat");
    await sendMessage(
      "Create a detailed YouTube production plan about: " + topic +
      ". Language: " + language + ". Target duration: " + duration +
      ". Include several title options, audience, opening hook, timed outline, " +
      "complete script, scene-by-scene visual directions, narration, sound effects, " +
      "thumbnail concept, editing instructions, captions and description. " +
      "Be honest about the approximate runtime and do not claim to have rendered a video."
    );
  };
}

function renderFiles() {
  const card = document.createElement("div");
  card.className = "tool-card";
  card.innerHTML = `
    <h2>▤ File Assistant</h2>
    <p class="muted">Read text-based files up to 1 MB. PDF/image OCR is not included.</p>
    <input id="fileInput" type="file"
      accept=".txt,.md,.csv,.json,.html,.css,.js,.xml,.log">
    <p class="muted" id="fileStatus" role="status"></p>
    <textarea id="fileContent" placeholder="File contents..."></textarea>
    <div class="tool-actions">
      <button class="secondary" id="fileSummary">Summarize</button>
      <button class="secondary" id="fileExplain">Explain</button>
      <button class="secondary" id="fileClear">Clear</button>
    </div>
  `;
  messageList.append(card);

  $("fileInput").onchange = async () => {
    const file = $("fileInput").files[0];
    $("fileContent").value = "";
    if (!file) return;

    if (file.size > 1024 * 1024) {
      $("fileStatus").textContent = "Maximum file size is 1 MB.";
      return;
    }

    try {
      $("fileContent").value = await file.text();
      $("fileStatus").textContent = "File loaded locally.";
    } catch {
      $("fileStatus").textContent = "Could not read this file.";
    }
  };

  
$("fileClear").onclick = () => {
  $("fileContent").value = "";
  $("fileInput").value = "";
  $("fileStatus").textContent = "";
};

async function fileAction(mode) {
  const content = $("fileContent").value.trim();

  if (!content) {
    $("fileStatus").textContent =
      "Please select a file or enter some text first.";
    return;
  }

  if (content.length > 12000) {
    $("fileStatus").textContent =
      "Text limit is 12,000 characters.";
    return;
  }

  const prompt =
    mode === "summarize"
      ? "Summarize this content. Explain the key points clearly:\n\n" + content
      : "Explain this content in simple language, step by step:\n\n" + content;

  setView("chat");
  await sendMessage(prompt);
}

$("fileSummarize").onclick = () => fileAction("summarize");
$("fileExplain").onclick = () => fileAction("explain");

function renderUtilities() {
  const box = document.createElement("div");
  box.className = "tool-card";

  box.innerHTML = `
    <h2>🛠 Utilities</h2>

    <h3>Word and character counter</h3>
    <textarea id="countText" placeholder="Enter text..."></textarea>
    <p id="countResult" class="muted">
      Words: 0 · Characters: 0
    </p>

    <h3>Text case converter</h3>
    <textarea id="caseText" placeholder="Enter text..."></textarea>

    <div class="tool-actions">
      <button class="secondary" id="caseUpper">UPPERCASE</button>
      <button class="secondary" id="caseLower">lowercase</button>
      <button class="secondary" id="caseTitle">Title Case</button>
    </div>

    <textarea id="caseResult" placeholder="Result..." readonly></textarea>
    <button class="secondary" id="copyResult">Copy result</button>
  `;

  messages.appendChild(box);

  $("countText").oninput = () => {
    const value = $("countText").value;
    const words = value.trim()
      ? value.trim().split(/\s+/).length
      : 0;

    $("countResult").textContent =
      "Words: " + words + " · Characters: " + value.length;
  };

  $("caseUpper").onclick = () => {
    $("caseResult").value = $("caseText").value.toUpperCase();
  };

  $("caseLower").onclick = () => {
    $("caseResult").value = $("caseText").value.toLowerCase();
  };

  $("caseTitle").onclick = () => {
    $("caseResult").value = $("caseText").value
      .toLowerCase()
      .replace(/\b\w/g, char => char.toUpperCase());
  };

  $("copyResult").onclick = async () => {
    try {
      await navigator.clipboard.writeText($("caseResult").value);
      setStatus("Copied to clipboard.");
    } catch {
      $("caseResult").focus();
      $("caseResult").select();
      setStatus("Select the text and copy it manually.");
    }
  };
}

$("chatForm").addEventListener("submit", async event => {
  event.preventDefault();

  const text = input.value.trim();
  if (!text || busy) return;

  input.value = "";
  await sendMessage(text);
});

$("newChatBtn").onclick = async () => {
  if (busy) return;
  await createChat();
  setView("chat");
};

$("menuBtn").onclick = () => {
  sidebar.classList.toggle("open");
};

document.querySelectorAll("[data-view]").forEach(button => {
  button.addEventListener("click", () => {
    setView(button.dataset.view);
  });
});

$("exportBtn").onclick = () => {
  const backup = {
    version: 1,
    exportedAt: new Date().toISOString(),
    chats
  };

  const blob = new Blob(
    [JSON.stringify(backup, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "ai-universe-backup.json";
  link.click();

  URL.revokeObjectURL(url);
  setStatus("Chat backup exported.");
};

$("logoutBtn").onclick = async () => {
  if (busy) {
    setStatus("Wait for the current response before signing out.");
    return;
  }

  try {
    await signOut(auth);
  } catch (error) {
    console.error(error);
    setStatus("Sign out failed. Please try again.");
  }
};

$("googleLoginBtn").onclick = async () => {
  const button = $("googleLoginBtn");
  button.disabled = true;
  showLogin("Opening Google sign-in...");

  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    await signInWithRedirect(auth, provider);
  } catch (error) {
    console.error("Google sign-in failed:", error);

    showLogin(
      error.code === "auth/unauthorized-domain"
        ? "Add this website domain to Firebase Authorized domains."
        : "Google sign-in failed. Check Firebase configuration and connection."
    );

    button.disabled = false;
  }
};

async function start() {
  try {
    if (
      firebaseConfig.apiKey === "YOUR_FIREBASE_API_KEY" ||
      firebaseConfig.projectId === "YOUR_PROJECT_ID" ||
      firebaseConfig.appId === "YOUR_FIREBASE_APP_ID"
    ) {
      showLogin("Firebase setup required. Add your real web-app configuration.");
      $("googleLoginBtn").disabled = true;
      return;
    }

    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);

    try {
      await getRedirectResult(auth);
    } catch (error) {
      console.error("Google redirect failed:", error);
      showLogin("Google sign-in could not be completed. Please try again.");
    }

    onAuthStateChanged(auth, async user => {
      currentUser = user;

      if (!user) {
        appShell.hidden = true;
        loginScreen.hidden = false;
        chats = [];
        activeChatId = null;
        showLogin("Sign in with Google to continue.");
        return;
      }

      loginScreen.hidden = true;
      appShell.hidden = false;
      $("accountLabel").textContent = user.email || "Google account";

      await loadChats();
    });
  } catch (error) {
    console.error("Application initialization failed:", error);
    showLogin("Firebase setup failed. Check your configuration.");
  }
}

start();
</script>
